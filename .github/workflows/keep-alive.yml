name: 💓 Keep Supabase awake
# Free Supabase projects are paused after a week without activity, which
# leaves the CRM hanging on load. One light read a day keeps it awake.
on:
    schedule:
        - cron: "17 11 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ping:
        name: 💓 Ping the database
        runs-on: ubuntu-latest
        timeout-minutes: 2
        env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SB_PUBLISHABLE_KEY: ${{ secrets.SB_PUBLISHABLE_KEY }}
        steps:
            - name: 💓 Read one row
              run: |
                  if [ -z "$SUPABASE_URL" ] || [ -z "$SB_PUBLISHABLE_KEY" ]; then
                    echo "::warning::Set the SUPABASE_URL and SB_PUBLISHABLE_KEY repository secrets to keep the database awake."
                    exit 0
                  fi
                  status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                    --max-time 30 \
                    --header "apikey: $SB_PUBLISHABLE_KEY" \
                    "$SUPABASE_URL/rest/v1/configuration?select=id&limit=1")
                  echo "Supabase answered HTTP $status"
                  if [ "$status" -ge 500 ] || [ "$status" = "000" ]; then
                    exit 1
                  fi
